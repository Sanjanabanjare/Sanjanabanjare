# Save this file in your profile repo at: .github/workflows/snake.yml
# It generates the pink contribution snake and publishes it to the "output" branch daily.

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Generate snake
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23d6336c&color_dots=%23ffe3ee,%23ffd1e3,%23ffb6d9,%23ff8fb8,%23d6336c
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23ff9ecb

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
